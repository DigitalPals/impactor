name: Source browser checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  sources:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-dev libxdo-dev libssl-dev
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Offline source and installer tests
        run: cargo test --locked -p plume_source -p plume_store -p plumeimpactor
